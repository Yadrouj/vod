# Optional initial import only; routine updates remain in maintenance.
# docker compose -f docker-compose.prod.yml -f docker-compose.meloobit.yml up -d --no-deps meloobit-backfill
services:
  meloobit-backfill:
    image: vod-app
    container_name: vod-meloobit-backfill
    restart: "on-failure:3"
    init: true
    stop_grace_period: 90s
    mem_limit: 1g
    cpus: 0.5
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      MUSIC_REFRESH_REQUEST_GAP_MS: "1000"
    command: ["node", "scripts/backfill-meloobit.mjs"]
    volumes:
      - ./public/data:/app/public/data
      - ./data:/app/data
      - vod_imdb_cache:/app/.media-cache
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
