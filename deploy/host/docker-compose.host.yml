# SarvNema on this host (46.34.163.178 / ubuntu-one).
#
# Neither shipped Compose file fits here:
#   * docker-compose.prod.yml       needs the external `infrastructure_default`
#                                   network and a dockerised nginx.
#   * docker-compose.production.yml brings its OWN nginx on port 80, which the
#                                   host nginx already owns (it serves the
#                                   pooltech.ir sites).
# So this file runs the app only, published on loopback, and the HOST nginx
# reverse-proxies sarvnema.ir to it. Do not run this together with either
# shipped file.
#
#   docker compose -f deploy/host/docker-compose.host.yml up -d --build
name: vod

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: vod-app
    container_name: vod-app
    restart: unless-stopped
    env_file:
      # Secrets (bot token, S3). Not in Git; see DEPLOY-ON-THIS-HOST.md.
      - path: ../../.env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      VOD_DATA_DIR: /app/public/data
    # Loopback only: the host nginx is the single public entry point.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../../public/data:/app/public/data
      - ../../data:/app/data
      - vod_episode_images:/app/.media-cache/episode-images
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:3000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    init: true
    stop_grace_period: 20s
    # Leaves room for the co-tenant sites on this 2-core box.
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Scrapers. Started only by the host timer through deploy/run-maintenance.sh:
  #   sudo bash deploy/install-maintenance-timer.sh deploy/host/docker-compose.host.yml
  # `scale: 0` keeps a plain `up -d` from also starting it as a daemon.
  maintenance:
    image: vod-app
    scale: 0
    depends_on:
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      VOD_DATA_DIR: /app/public/data
      MAINTENANCE_TIME_ZONE: ${MAINTENANCE_TIME_ZONE:-Asia/Tehran}
      MAINTENANCE_IDLE_START_HOUR: ${MAINTENANCE_IDLE_START_HOUR:-3}
      MAINTENANCE_IDLE_END_HOUR: ${MAINTENANCE_IDLE_END_HOUR:-7}
      MAINTENANCE_READY_URL: http://app:3000/readyz
      # Empty: use actual request queues; set a number only for a strict traffic cap.
      MAINTENANCE_MAX_RECENT_REQUESTS: ${MAINTENANCE_MAX_RECENT_REQUESTS:-}
      MAINTENANCE_MAX_ACTIVE_ROOMS: ${MAINTENANCE_MAX_ACTIVE_ROOMS:-1}
      # The app is limited to 2 GB here and sits near 1.2 GB when idle.
      MAINTENANCE_MAX_MEMORY_MB: ${MAINTENANCE_MAX_MEMORY_MB:-1800}
      MAINTENANCE_MAX_LOAD_AVG: ${MAINTENANCE_MAX_LOAD_AVG:-1.25}
      VOD_SOURCE_URL: ${VOD_SOURCE_URL:-https://dls2.aparatchi-dlcenter.top/DonyayeSerial/donyaye_serial_all_archive.html}
      MOVIESHO_DOWNLOAD_BASE: ${MOVIESHO_DOWNLOAD_BASE:-https://sr1.moviesho.com/}
      MOVIESHO_SITE_BASE: ${MOVIESHO_SITE_BASE:-https://www.moviesho.com/}
      MOVIESHO_MOVIE_YEARS: ${MOVIESHO_MOVIE_YEARS:-2025,2026}
      MOVIESHO_SITE_REQUEST_INTERVAL_MS: ${MOVIESHO_SITE_REQUEST_INTERVAL_MS:-1000}
      MOVIESHO_SITE_RETRIES: ${MOVIESHO_SITE_RETRIES:-2}
      CURATED_VOD_PAGE_LIMIT: ${CURATED_VOD_PAGE_LIMIT:-2}
      CURATED_VOD_DETAIL_LIMIT: ${CURATED_VOD_DETAIL_LIMIT:-60}
      CURATED_VOD_RETRIES: ${CURATED_VOD_RETRIES:-2}
      CURATED_VOD_TIMEOUT_MS: ${CURATED_VOD_TIMEOUT_MS:-15000}
      CURATED_VOD_CONCURRENCY: ${CURATED_VOD_CONCURRENCY:-1}
      CURATED_VOD_REQUEST_GAP_MS: ${CURATED_VOD_REQUEST_GAP_MS:-1000}
      VOD_SERIES_EXPAND_CONCURRENCY: ${VOD_SERIES_EXPAND_CONCURRENCY:-1}
      VOD_SERIES_EXPAND_CHANGED_LIMIT: ${VOD_SERIES_EXPAND_CHANGED_LIMIT:-100}
      # IMDb release/news discovery remains daily; the large title dataset scan is weekly.
      VOD_SYNC_METADATA_INTERVAL_MS: ${VOD_SYNC_METADATA_INTERVAL_MS:-604800000}
      MUSIC_REFRESH_REQUEST_GAP_MS: ${MUSIC_REFRESH_REQUEST_GAP_MS:-1200}
      IMDB_DATA_API_BASE: ${IMDB_DATA_API_BASE:-http://185.203.118.87:8026}
      NODE_OPTIONS: --max-old-space-size=2304
    command: ["node", "scripts/maintenance-scheduler.mjs"]
    init: true
    stop_grace_period: 20s
    mem_limit: 3g
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../../public/data:/app/public/data
      - ../../data:/app/data
      - vod_imdb_cache:/app/.media-cache
      - vod_episode_images:/app/.media-cache/episode-images

  # Telegram bot and channel run on 62.83.32.47: docs/telegram-remote-server.md

volumes:
  vod_episode_images:
  vod_imdb_cache:
