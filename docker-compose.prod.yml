# Production deploy for VOD (sarvnema.ir) on the infrastructure host (185.203.118.87).
#
# Joins the EXISTING `infrastructure_default` network so the dockerised nginx
# (mn2-nginx) can reverse-proxy to it by name. TLS is terminated upstream at the
# ArvanCloud CDN; nginx serves this origin over plain HTTP (like the other sites).
#
# Usage:  docker compose -f docker-compose.prod.yml up -d --build
name: vod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vod-app
    container_name: vod-app
    restart: unless-stopped
    env_file:
      # Optional at run time (no required server secrets); NEXT_PUBLIC_* are baked
      # at build time. required:false so `up` still works if you skip the file.
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      VOD_DATA_DIR: /app/public/data
    volumes:
      - ./public/data:/app/public/data
      - ./data:/app/data
    networks:
      - edge

  catalog-sync:
    image: vod-app
    container_name: vod-catalog-sync
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      VOD_DATA_DIR: /app/public/data
      VOD_SYNC_INTERVAL_MS: ${VOD_SYNC_INTERVAL_MS:-21600000}
      VOD_SYNC_INITIAL_DELAY_MS: ${VOD_SYNC_INITIAL_DELAY_MS:-90000}
      NODE_OPTIONS: --max-old-space-size=3072
    command: ["node", "scripts/catalog-sync-daemon.mjs"]
    volumes:
      - ./public/data:/app/public/data
      - vod_imdb_cache:/app/.media-cache
    networks:
      - edge

networks:
  # Pre-existing network owned by the infrastructure stack (holds mn2-nginx).
  edge:
    external: true
    name: infrastructure_default

volumes:
  vod_imdb_cache:
