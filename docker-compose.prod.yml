# Production deploy for VOD (sarvnema.ir) on the infrastructure host (185.203.118.87).
#
# Joins the EXISTING `infrastructure_default` network so the dockerised nginx
# (mn2-nginx) can reverse-proxy to it by name. TLS is terminated upstream at the
# ArvanCloud CDN; nginx serves this origin over plain HTTP (like the other sites).
#
# Usage:  docker compose -f docker-compose.prod.yml up -d --build
name: vod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vod-app
    container_name: vod-app
    restart: unless-stopped
    env_file:
      # Optional at run time (no required server secrets); NEXT_PUBLIC_* are baked
      # at build time. required:false so `up` still works if you skip the file.
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      VOD_DATA_DIR: /app/public/data
    volumes:
      - ./public/data:/app/public/data
      - ./data:/app/data
      # Mirrored TVMaze episode stills served by /api/episode-image.
      - vod_episode_images:/app/.media-cache/episode-images
    networks:
      - edge

  maintenance:
    image: vod-app
    container_name: vod-maintenance
    mem_limit: 3g
    cpus: 0.75
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      VOD_DATA_DIR: /app/public/data
      MAINTENANCE_TIME_ZONE: ${MAINTENANCE_TIME_ZONE:-Asia/Tehran}
      MAINTENANCE_IDLE_START_HOUR: ${MAINTENANCE_IDLE_START_HOUR:-3}
      MAINTENANCE_IDLE_END_HOUR: ${MAINTENANCE_IDLE_END_HOUR:-7}
      MAINTENANCE_POLL_MS: ${MAINTENANCE_POLL_MS:-900000}
      MAINTENANCE_READY_URL: http://vod-app:3000/readyz
      # Empty: use actual request queues; set a number only for a strict traffic cap.
      MAINTENANCE_MAX_RECENT_REQUESTS: ${MAINTENANCE_MAX_RECENT_REQUESTS:-}
      MAINTENANCE_MAX_ACTIVE_ROOMS: ${MAINTENANCE_MAX_ACTIVE_ROOMS:-1}
      MAINTENANCE_MAX_MEMORY_MB: ${MAINTENANCE_MAX_MEMORY_MB:-1350}
      MAINTENANCE_MAX_LOAD_AVG: ${MAINTENANCE_MAX_LOAD_AVG:-1.25}
      MOVIESHO_DOWNLOAD_BASE: ${MOVIESHO_DOWNLOAD_BASE:-https://sr1.moviesho.com/}
      MOVIESHO_SITE_BASE: ${MOVIESHO_SITE_BASE:-https://www.moviesho.com/}
      MOVIESHO_MOVIE_YEARS: ${MOVIESHO_MOVIE_YEARS:-2025,2026}
      MOVIESHO_SITE_REQUEST_INTERVAL_MS: ${MOVIESHO_SITE_REQUEST_INTERVAL_MS:-1000}
      MOVIESHO_SITE_RETRIES: ${MOVIESHO_SITE_RETRIES:-2}
      CURATED_VOD_PAGE_LIMIT: ${CURATED_VOD_PAGE_LIMIT:-2}
      CURATED_VOD_DETAIL_LIMIT: ${CURATED_VOD_DETAIL_LIMIT:-60}
      CURATED_VOD_RETRIES: ${CURATED_VOD_RETRIES:-2}
      CURATED_VOD_TIMEOUT_MS: ${CURATED_VOD_TIMEOUT_MS:-15000}
      CURATED_VOD_CONCURRENCY: ${CURATED_VOD_CONCURRENCY:-1}
      CURATED_VOD_REQUEST_GAP_MS: ${CURATED_VOD_REQUEST_GAP_MS:-1000}
      VOD_SERIES_EXPAND_CONCURRENCY: ${VOD_SERIES_EXPAND_CONCURRENCY:-1}
      VOD_SERIES_EXPAND_CHANGED_LIMIT: ${VOD_SERIES_EXPAND_CHANGED_LIMIT:-100}
      # IMDb release/news discovery remains daily; the large title dataset scan is weekly.
      VOD_SYNC_METADATA_INTERVAL_MS: ${VOD_SYNC_METADATA_INTERVAL_MS:-604800000}
      MUSIC_REFRESH_REQUEST_GAP_MS: ${MUSIC_REFRESH_REQUEST_GAP_MS:-1200}
      NODE_OPTIONS: --max-old-space-size=2304
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    stop_grace_period: 20s
    command: ["node", "scripts/maintenance-scheduler.mjs", "--daemon"]
    volumes:
      - ./public/data:/app/public/data
      - ./data:/app/data
      - vod_imdb_cache:/app/.media-cache
      - vod_episode_images:/app/.media-cache/episode-images
    networks:
      - edge

  telegram-bot:
    image: vod-app
    container_name: vod-telegram-bot
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      # Supplies BOT_API_TOKEN (Telegram token, also used as the site API token).
      # required:false so `up` still works before the token is configured.
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      # `app` is ambiguous on the shared external network; address the container.
      BOT_SITE_URL: ${BOT_SITE_URL:-http://vod-app:3000}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    stop_grace_period: 20s
    command: ["node", "scripts/telegram-bot.mjs"]
    networks:
      - edge

  telegram-channel:
    image: vod-app
    container_name: vod-telegram-channel
    profiles: ["channel"]
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      BOT_SITE_URL: http://vod-app:3000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://sarvnema.ir}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-@sarvnema}
      TELEGRAM_CHANNEL_ENABLED: ${TELEGRAM_CHANNEL_ENABLED:-1}
      TELEGRAM_CHANNEL_BATCH_SIZE: ${TELEGRAM_CHANNEL_BATCH_SIZE:-5}
      TELEGRAM_CHANNEL_STATE_DIR: /app/.media-cache/telegram-channel
    command: ["node", "scripts/telegram-channel.mjs", "--daemon"]
    init: true
    stop_grace_period: 60s
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./public/data:/app/public/data:ro
      - vod_telegram_channel:/app/.media-cache/telegram-channel
    networks:
      - edge

networks:
  # Pre-existing network owned by the infrastructure stack (holds mn2-nginx).
  edge:
    external: true
    name: infrastructure_default

volumes:
  vod_imdb_cache:
  vod_episode_images:
  vod_telegram_channel:
